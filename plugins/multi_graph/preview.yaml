# What tools/preview.py shows (docs/PREVIEW.md). The app answers every question with the one answer under commands,
# so the four lines share their history; they differ in the live value (the states) and the legend.
tiles:
  - tile: graph
    name: Basement
    options: { s1: sensor.ups_power, s2: sensor.server_power, s3: sensor.network_power, s4: sensor.solar_power, hours: "24" }
    sizes: [2x1, 4x2]
  - tile: graph
    name: Two sensors
    options: { s1: sensor.ups_power, s2: sensor.solar_power, hours: "12", stat: max }
    sizes: [2x1]
  - tile: graph
    name: Nothing chosen
    sizes: [2x1]

states:
  sensor.ups_power: { state: "612.4", attributes: { unit_of_measurement: W, friendly_name: UPS } }
  sensor.server_power: { state: "341", attributes: { unit_of_measurement: W, friendly_name: Server } }
  sensor.network_power: { state: "88.7", attributes: { unit_of_measurement: W, friendly_name: Network } }
  sensor.solar_power: { state: "1520", attributes: { unit_of_measurement: W, friendly_name: Solar } }

